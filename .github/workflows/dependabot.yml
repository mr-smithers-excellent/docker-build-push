name: Dependabot

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  unit-tests:
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out PR code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.DEPENDABOT_DIST_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Sync dist/ if stale
        run: |
          npm run build
          git add dist/
          if git diff --staged --quiet; then
            echo "dist/ is up-to-date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: rebuild dist"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

  e2e:
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit
    with:
      pr-trigger: false
      ref: ${{ github.event.pull_request.head.sha }}

  auto-merge:
    needs: [unit-tests, e2e]
    if: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: |
          url="${{ github.event.pull_request.html_url }}"
          if gh pr merge --auto --merge "$url"; then
            exit 0
          fi
          # gh pr merge --auto merges immediately when all required checks
          # already passed, so the PR can become merged before this command's
          # own follow-up merge call runs, which then fails with "not
          # mergeable". That's not a real failure - only treat it as one if
          # the PR isn't actually merged.
          if [ "$(gh pr view "$url" --json merged --jq .merged)" = "true" ]; then
            echo "PR already merged; treating as success."
            exit 0
          fi
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
